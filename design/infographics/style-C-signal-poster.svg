<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<style>@font-face{font-family:'Big';src:url('fonts/BigShoulders-Bold.ttf')}
@font-face{font-family:'Sans';src:url('fonts/InstrumentSans-Regular.ttf')}
@font-face{font-family:'SansB';src:url('fonts/InstrumentSans-Bold.ttf')}
 .big{font-family:Big} .s{font-family:Sans;fill:#12263F} .sb{font-family:SansB;fill:#12263F}</style>
<rect width="1200" height="675" fill="#EDF1F5"/>
<rect width="470" height="675" fill="#12263F"/>
<text x="56" y="168" class="big" font-size="124" fill="#fff">RADIO</text>
<text x="56" y="284" class="big" font-size="124" fill="#fff">IN.</text>
<text x="56" y="400" class="big" font-size="124" fill="#F0700A">MAP</text>
<text x="56" y="516" class="big" font-size="124" fill="#F0700A">OUT.</text>
<text x="60" y="590" font-family="Sans" font-size="20" fill="#C9D6E3">No Internet at the command post?</text>
<text x="60" y="618" font-family="Sans" font-size="20" fill="#C9D6E3">RangerTrak doesn't need it.</text>
<!-- three steps -->
<g transform="translate(540,70)"><text class="big" font-size="96" fill="#F0700A" y="78">1</text>
      <g transform="translate(100,6)"><rect x="22" y="14" width="34" height="62" rx="6" fill="#12263F"/><rect x="42" y="-8" width="5" height="26" fill="#12263F"/><rect x="28" y="24" width="22" height="14" fill="#EDF1F5"/><path d="M74.3,17.7 A16,16 0 0 1 76.3,40.3" fill="none" stroke="#F0700A" stroke-width="5" stroke-linecap="round" opacity="1.00"/>
<path d="M82.6,7.8 A29,29 0 0 1 86.2,48.6" fill="none" stroke="#F0700A" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
<path d="M91.0,-2.2 A42,42 0 0 1 96.2,57.0" fill="none" stroke="#F0700A" stroke-width="5" stroke-linecap="round" opacity="0.64"/></g>
      <text x="220" y="36" class="sb" font-size="28">The team radios in</text><text x="220" y="68" class="s" font-size="20">“Rim 1, Trailview Overlook. No sign.”</text></g><g transform="translate(540,265)"><text class="big" font-size="96" fill="#F0700A" y="78">2</text>
      <g transform="translate(100,6)"><rect x="4" y="12" width="84" height="54" rx="5" fill="#12263F"/><path d="M-6,70 H98 L90,80 H2 Z" fill="#12263F"/><rect x="14" y="22" width="60" height="5" fill="#F0700A"/><rect x="14" y="33" width="48" height="5" fill="#5B7A99"/><rect x="14" y="44" width="36" height="5" fill="#5B7A99"/><rect x="14" y="55" width="24" height="5" fill="#5B7A99"/></g>
      <text x="220" y="36" class="sb" font-size="28">The scribe types it</text><text x="220" y="68" class="s" font-size="20">Who, where, when, what. Any grid format.</text></g><g transform="translate(540,460)"><text class="big" font-size="96" fill="#F0700A" y="78">3</text>
      <g transform="translate(100,6)"><path d="M46,80 l-24,-34 a30,30 0 1 1 48,0 z" fill="#F0700A"/><circle cx="46" cy="30" r="11" fill="#EDF1F5"/></g>
      <text x="220" y="36" class="sb" font-size="28">RangerTrak maps it</text><text x="220" y="68" class="s" font-size="20">Live map, radio log, 309 &amp; 213.</text></g>
<path d="M540,238 H1150 M540,433 H1150" stroke="#C5D0DB" stroke-width="1.5"/>
